<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temple Picture Album</title>
    <meta name="author" content="Emily Bennion">
    <meta name="description" content="A picture album of various temples from all around the world at different seasons of the year.">
    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css" media="(min-width: 768px)">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="scripts/temples.js" defer></script>
</head>
<body>
    <header>
        <h1>Temple Album</h1>
        <button id="hamburger" aria-label="Open navigation menu">
            ☰
        </button>
        <nav>
            <ul class="navigation">
                <li><a href="#">Home</a></li>
                <li><a href="#">Old</a></li>
                <li><a href="#">New</a></li>
                <li><a href="#">Large</a></li>
                <li><a href="#">Small</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Home</h2>
        <div id="temples">
            <figure>
                <img src="images/atlanta_temple.jpg" alt="Atlanta Temple">
                <figcaption>Atlanta Temple</figcaption>
            </figure>
            <figure>
                <img src="images/desmoines_temple_rendering.jpg" alt="Des Moines Temple">
                <figcaption>Des Moines Temple Rendering</figcaption>
            </figure>
            <figure>
                <img src="images/salt_lake_temple.jpg" alt="Salt Lake Temple">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>
            <figure>
                <img src="images/accra_ghana_temple.jpg" alt="Accra Ghana Temple">
                <figcaption>Accra Ghana Temple</figcaption>
            </figure>
            <figure>
                <img src="images/gilbert_arizona_temple.jpg" alt="Gilbert Arizona Temple">
                <figcaption>Gilbert Arizona Temple</figcaption>
            </figure>
            <figure>
                <img src="images/jordan_river_temple.jpg" alt="Jordan River Temple">
                <figcaption>Jordan River Temple</figcaption>
            </figure>
            <figure>
                <img src="images/nauvoo_temple.jpg" alt="Nauvoo Temple">
                <figcaption>Nauvoo Temple</figcaption>
            </figure>
            <figure>
                <img src="images/orlando_florida_temple.jpg" alt="Orlando Temple">
                <figcaption>Orlando Temple</figcaption>
            </figure>
            <figure>
                <img src="images/santiago_chile_temple.jpg" alt="Santiago Chile Temple">
                <figcaption>Santiago Chile Temple</figcaption>
            </figure>
        </div>    
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🤍 Emily Bennion 🤍 Iowa, United States</p>
        <p id="lastmodified"></p>
    </footer>
</body>
</html>
